services:
  gpt-sovits-jetson:
    build:
      context: .
      dockerfile: Dockerfile.jetson
    image: gpt-sovits-jetson:local
    container_name: gpt-sovits-jetson
    environment:
      GPT_SOVITS_TTS_CONFIG: GPT_SoVITS/configs/tts_infer.yaml
      GPT_SOVITS_RUNTIME_DIR: /workspace/runtime
      GPT_SOVITS_MODEL_ID: gpt-sovits-v2proplus-jetson
      GPT_SOVITS_MAX_CONCURRENT: "1"
      GPT_SOVITS_MAX_QUEUE: "16"
      GPT_SOVITS_ENABLE_G2PW: auto
      GPT_SOVITS_REQUIRE_ONNX_GPU: "true"
      GPT_SOVITS_ONNX_INTRA_OP_THREADS: "1"
      GPT_SOVITS_ONNX_INTER_OP_THREADS: "1"
      GPT_SOVITS_TORCH_NUM_THREADS: "1"
      GPT_SOVITS_TORCH_INTEROP_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - ./runtime:/workspace/runtime
      - ./test-results:/workspace/test-results
    restart: unless-stopped
    network_mode: host
